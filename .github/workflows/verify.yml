name: Verify Tessera
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install verified development toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
          rustup default 1.97.1
          rustc -vV
          python -m pip install -r scripts/requirements-dev.txt
      - name: Format and current native tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-features
          cargo clippy --locked --all-targets --all-features
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s tests/project_io -p 'test_*.py'
      - name: Isolated Excel safety proof
        working-directory: crates/tessera-workbook
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Mac production coverage
        if: runner.os == 'macOS'
        run: python scripts/coverage.py --output .build/ci-coverage
      - name: Preserve Mac coverage evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-production-coverage
          path: |
            .build/ci-coverage/summary.json
            .build/ci-coverage/production.lcov
            .build/ci-coverage/test-run.log
            .build/ci-coverage/worker-test-run.log
          if-no-files-found: warn
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check current dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check declared Rust 1.95 minimum
        run: |
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 check --locked --all-targets --all-features
          cargo +1.95 check --manifest-path crates/tessera-workbook/Cargo.toml --locked --all-targets
